name: Package LF ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-lf-zip.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current LF
        uses: actions/checkout@v4
      - name: Create exact repository ZIP
        run: git archive --format=zip --output=LF-Inteligente-V3.7.5-ATUALIZADO-20261006.zip HEAD
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LF-Inteligente-V3.7.5-ATUALIZADO-20261006
          path: LF-Inteligente-V3.7.5-ATUALIZADO-20261006.zip
          retention-days: 7
