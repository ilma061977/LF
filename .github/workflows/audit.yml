name: Auditoria LF Inteligente
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Empacotar site para deploy alternativo
        uses: actions/upload-artifact@v4
        with:
          name: lf-inteligente-site
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
