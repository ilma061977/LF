name: Empacotar LF produção

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-lf-production.yml

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versão publicada
        uses: actions/checkout@v4
        with:
          ref: 0bfd90760d4998d8de076b06152a648f28b680cf
          fetch-depth: 0

      - name: Criar ZIP LF
        run: |
          ZIP="LF-Inteligente-V3.7.5-M58-Prioridades-EXA-Rev20-20261008.zip"
          rm -f "$ZIP"
          zip -qr "$ZIP" .             -x '.git/*'                'mega-app/*'                'tmn-inteligente-particular/*'
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: LF-Inteligente-V3.7.5-M58-Prioridades-EXA-Rev20-20261008
          path: |
            LF-Inteligente-V3.7.5-M58-Prioridades-EXA-Rev20-20261008.zip
            LF-Inteligente-V3.7.5-M58-Prioridades-EXA-Rev20-20261008.zip.sha256
          compression-level: 0
          retention-days: 30
