name: Finalize Mega v1.16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-mega-v115.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp .github/mega_v116_finalize.py /tmp/mega_v116_finalize.py
          python /tmp/mega_v116_finalize.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mega-app/index.html
            git commit -m "Mega v1.16: finalize Exa-2 and Delta labels"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Finalize gh-pages
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          python /tmp/mega_v116_finalize.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mega-app/index.html
            git commit -m "Mega v1.16: finalize Exa-2 and Delta labels"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
