name: Auditoria LF V3.7.5

on:
  push:
    branches:
      - preview-solotofacil-v375-20260926
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auditoria completa
        run: npm test
      - name: Empacotar versão atual para ChatGPT
        uses: actions/upload-artifact@v4
        with:
          name: LF-Inteligente-V3.7.5-Atualizado-ChatGPT
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          if-no-files-found: error
