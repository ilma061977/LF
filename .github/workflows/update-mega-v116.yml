name: Update Mega v1.16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-mega-v116.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare v1.16 patch
        run: |
          git fetch origin main
          git checkout -B main origin/main
          base64 -d .github/mega_v116_patch.py.gz.b64 | gzip -d > /tmp/mega_v116_patch.py
          cp mega-app/exa2-data.js /tmp/exa2-data.js
          python -m py_compile /tmp/mega_v116_patch.py

      - name: Patch main
        run: |
          python /tmp/mega_v116_patch.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mega-app/index.html mega-app/exa2-data.js
            git commit -m "Mega v1.16: EXA-2 research and DELTA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Patch gh-pages
        run: |
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/exa2-data.js mega-app/exa2-data.js
          python /tmp/mega_v116_patch.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mega-app/index.html mega-app/exa2-data.js
            git commit -m "Mega v1.16: EXA-2 research and DELTA"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
