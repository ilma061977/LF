# LF Inteligente Particular — static standalone deploy on Netlify
# Deploy repository branch main, publish root; index.html embeds the V3.7.7 engines.
[build]
  publish = "."
  command = "echo 'LF Inteligente static release — no build necessary'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
